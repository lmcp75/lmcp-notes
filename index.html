<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMCP Notes | Pharmacy Study Hub</title>
  <meta name="description" content="LMCP B.Pharm students માટે semester-wise notes અને PDF study material.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    header {
      background: #123c69;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; color: #dbeafe; }
    main { max-width: 950px; margin: auto; padding: 20px 14px; }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px #0000000b;
    }
    h2 { margin-top: 0; font-size: 21px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #d3dbe7;
      font-size: 15px;
    }
    button {
      border: none;
      background: #1769aa;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #e9f1fb; color: #123c69; }
    .danger { background: #b42318; }
    .note {
      border: 1px solid #e0e6ef;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
      background: #fff;
    }
    .note h3 { margin: 0 0 8px; overflow-wrap: anywhere; }
    .muted { color: #64748b; font-size: 14px; }
    .status { margin: 10px 0; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    footer { text-align: center; padding: 22px; color: #64748b; }
    .tag {
      display: inline-block;
      background: #eaf2ff;
      color: #174a80;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
<header>
  <h1>📚 LMCP Notes</h1>
  <p>B.Pharm Study Material • Learn Better, Score Better</p>
</header>

<main>
  <section class="panel">
    <h2>🔍 Find Your Notes</h2>
    <input id="search" type="search"
      placeholder="Search subject, unit or notes title...">

    <select id="semesterFilter">
      <option value="">All Semesters</option>
      <option value="1">Semester 1</option>
      <option value="2">Semester 2</option>
      <option value="3">Semester 3</option>
      <option value="4">Semester 4</option>
      <option value="5">Semester 5</option>
      <option value="6">Semester 6</option>
      <option value="7">Semester 7</option>
      <option value="8">Semester 8</option>
    </select>

    <p class="muted">Choose a semester or search for your subject.</p>
    <div id="notesList" class="status">Loading notes...</div>
  </section>

  <section class="panel">
    <h2>🔐 Admin Login</h2>
    <p class="muted">Authorized admin only.</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email"
        autocomplete="username" required>
      <input id="password" type="password" placeholder="Admin password"
        autocomplete="current-password" required>
      <button id="loginButton" type="submit">Login</button>
    </form>

    <button id="logoutButton" class="secondary hidden" type="button">
      Logout
    </button>
    <div id="loginStatus" class="status" role="status"></div>
  </section>

  <section id="adminPanel" class="panel hidden">
    <h2>📤 Upload New Notes</h2>
    <p class="muted">PDF only. Maximum file size: 10 MB.</p>

    <form id="uploadForm">
      <input id="title" type="text" placeholder="Notes title"
        maxlength="150" required>

      <select id="semester" required>
        <option value="">Select Semester</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
        <option value="7">Semester 7</option>
        <option value="8">Semester 8</option>
      </select>

      <input id="subject" type="text" placeholder="Subject name"
        maxlength="120" required>

      <input id="unit" type="text" placeholder="Unit (e.g. Unit 1)"
        maxlength="80" required>

      <input id="pdfFile" type="file" accept=".pdf,application/pdf" required>

      <button id="uploadButton" type="submit">Upload PDF</button>
    </form>

    <div id="uploadStatus" class="status" role="status"></div>
  </section>
</main>

<footer>LMCP Notes • Made for B.Pharm Students</footer>

<script>
  // Supabase project configuration
  const SUPABASE_URL = "https://dirleyzhcikbsufynqzg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_42U_nw07b6_TbEqJm4NxtA_Twzc_hWC";
  const ADMIN_UID = "27c47ba2-3b13-407f-91f2-9f17366ae003";

  const $ = (id) => document.getElementById(id);

  const notesList = $("notesList");
  const loginStatus = $("loginStatus");
  const uploadStatus = $("uploadStatus");

  let db = null;
  let allNotes = [];
  let currentUser = null;

  function setStatus(element, message, isError = false) {
    element.textContent = message;
    element.style.color = isError ? "#b42318" : "#17633b";
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function getClient() {
    if (
      !SUPABASE_URL.startsWith("https://") ||
      !SUPABASE_URL.endsWith(".supabase.co") ||
      !SUPABASE_KEY.startsWith("sb_publishable_") ||
      !ADMIN_UID
    ) {
      throw new Error("Supabase settings પહેલાં પૂર્ણ કરો.");
    }

    if (!db) {
      if (!window.supabase) {
        throw new Error("Supabase library load થઈ નથી. Internet ચેક કરો.");
      }
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    return db;
  }

  function isAdmin() {
    return Boolean(currentUser && currentUser.id === ADMIN_UID);
  }

  function updateLoginUI() {
    $("loginForm").classList.toggle("hidden", Boolean(currentUser));
    $("logoutButton").classList.toggle("hidden", !currentUser);
    $("adminPanel").classList.toggle("hidden", !isAdmin());

    if (currentUser && !isAdmin()) {
      setStatus(loginStatus,
        "આ account admin નથી. Admin account થી login કરો.", true);
    } else if (isAdmin()) {
      setStatus(loginStatus, "Admin login સફળ થયું!");
    }
  }

  async function loadNotes() {
    try {
      getClient();

      const { data, error } = await db
        .from("notes")
        .select("id,title,semester,subject,unit,file_path,created_at")
        .order("created_at", { ascending: false });

      if (error) throw error;

      allNotes = data || [];
      renderNotes();
    } catch (error) {
      notesList.textContent =
        "Notes load ન થઈ શકી: " + error.message;
    }
  }

  function renderNotes() {
    const searchTerm = $("search").value.trim().toLowerCase();
    const selectedSemester = $("semesterFilter").value;

    const filtered = allNotes.filter((note) => {
      const content = [
        note.title, note.subject, note.unit, note.semester
      ].join(" ").toLowerCase();

      return content.includes(searchTerm) &&
        (!selectedSemester ||
          String(note.semester) === selectedSemester);
    });

    if (!filtered.length) {
      notesList.textContent = allNotes.length
        ? "આ search માટે notes મળી નથી."
        : "હજી notes upload કરવામાં આવી નથી.";
      return;
    }

    notesList.innerHTML = filtered.map((note) => `
      <article class="note">
        <span class="tag">Semester ${escapeHTML(note.semester)}</span>
        <h3>${escapeHTML(note.title)}</h3>
        <p class="muted">
          Subject: ${escapeHTML(note.subject)}<br>
          ${escapeHTML(note.unit)}
        </p>
        <button type="button" data-download="${escapeHTML(note.id)}">
          View / Download PDF
        </button>
        ${isAdmin() ? `
          <button type="button" class="danger"
            data-delete="${escapeHTML(note.id)}">
            Delete Note
          </button>` : ""}
      </article>
    `).join("");
  }

  $("search").addEventListener("input", renderNotes);
  $("semesterFilter").addEventListener("change", renderNotes);

  notesList.addEventListener("click", async (event) => {
    const downloadId = event.target.dataset.download;
    const deleteId = event.target.dataset.delete;

    if (downloadId) {
      const note = allNotes.find((item) => item.id === downloadId);
      if (!note) return;

      try {
        const { data, error } = await getClient()
          .storage.from("notes")
          .createSignedUrl(note.file_path, 3600);

        if (error) throw error;
        window.open(data.signedUrl, "_blank", "noopener,noreferrer");
      } catch (error) {
        alert("PDF ખોલી શકાઈ નથી: " + error.message);
      }
    }

    if (deleteId) {
      if (!isAdmin()) {
        alert("આ action માટે admin login જરૂરી છે.");
        return;
      }

      const note = allNotes.find((item) => item.id === deleteId);
      if (!note || !confirm("આ note delete કરવી છે?")) return;

      try {
        const { error: storageError } = await getClient()
          .storage.from("notes").remove([note.file_path]);

        if (storageError) throw storageError;

        const { error: dbError } = await getClient()
          .from("notes").delete().eq("id", note.id);

        if (dbError) throw dbError;

        setStatus(uploadStatus, "Note delete થઈ ગઈ.");
        await loadNotes();
      } catch (error) {
        alert("Delete થઈ શક્યું નથી: " + error.message);
      }
    }
  });

  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const button = $("loginButton");
    button.disabled = true;
    setStatus(loginStatus, "Login થઈ રહ્યું છે...");

    try {
      const client = getClient();
      const { data, error } = await client.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) throw error;

      currentUser = data.user;
      updateLoginUI();

      if (isAdmin()) {
        setStatus(loginStatus, "Admin login સફળ થયું!");
      } else {
        await client.auth.signOut();
        currentUser = null;
        updateLoginUI();
        setStatus(loginStatus,
          "Login થયું, પરંતુ આ account ની UID admin UID સાથે મળતી નથી.",
          true);
      }

      renderNotes();
    } catch (error) {
      setStatus(loginStatus, error.message, true);
    } finally {
      button.disabled = false;
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    try {
      const { error } = await getClient().auth.signOut();
      if (error) throw error;

      currentUser = null;
      updateLoginUI();
      renderNotes();
      setStatus(loginStatus, "Logout થઈ ગયું.");
    } catch (error) {
      setStatus(loginStatus, error.message, true);
    }
  });

  $("uploadForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!isAdmin()) {
      setStatus(uploadStatus, "પહેલાં admin login કરો.", true);
      return;
    }

    const file = $("pdfFile").files[0];
    if (!file) {
      setStatus(uploadStatus, "PDF file પસંદ કરો.", true);
      return;
    }

    if (
      file.type !== "application/pdf" &&
      !file.name.toLowerCase().endsWith(".pdf")
    ) {
      setStatus(uploadStatus, "માત્ર PDF file upload કરી શકાય.", true);
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      setStatus(uploadStatus, "PDF file 10 MB થી નાની હોવી જોઈએ.", true);
      return;
    }

    const button = $("uploadButton");
    button.disabled = true;
    setStatus(uploadStatus, "PDF upload થઈ રહી છે...");

    let uploadedPath = null;

    try {
      const client = getClient();
      const semester = $("semester").value;
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const filePath =
        `${semester}/${crypto.randomUUID()}-${safeName}`;

      const { error: storageError } = await client
        .storage.from("notes")
        .upload(filePath, file, {
          contentType: "application/pdf",
          upsert: false
        });

      if (storageError) throw storageError;
      uploadedPath = filePath;

      const { error: insertError } = await client
        .from("notes")
        .insert({
          title: $("title").value.trim(),
          semester: Number(semester),
          subject: $("subject").value.trim(),
          unit: $("unit").value.trim(),
          file_path: filePath
        });

      if (insertError) {
        // If database insert fails, try to remove the uploaded file.
        await client.storage.from("notes").remove([uploadedPath]);
        throw insertError;
      }

      $("uploadForm").reset();
      setStatus(uploadStatus, "PDF સફળતાપૂર્વક upload થઈ ગઈ!");
      await loadNotes();
    } catch (error) {
      setStatus(uploadStatus, "Upload નિષ્ફળ: " + error.message, true);
    } finally {
      button.disabled = false;
    }
  });

  async function startApp() {
    try {
      const client = getClient();
      const { data, error } = await client.auth.getSession();
      if (error) throw error;

      currentUser = data.session?.user || null;

      if (currentUser && !isAdmin()) {
        await client.auth.signOut();
        currentUser = null;
      }

      updateLoginUI();
      await loadNotes();

      client.auth.onAuthStateChange((_event, session) => {
        currentUser = session?.user || null;
        updateLoginUI();
        renderNotes();
      });
    } catch (error) {
      notesList.textContent = error.message;
      setStatus(loginStatus, error.message, true);
    }
  }

  startApp();
</script>
</body>
</html>
